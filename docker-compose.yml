services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      PASARPULSE_MODE: ${PASARPULSE_MODE:-auto}
      PASARPULSE_LLM_API_KEY: ${PASARPULSE_LLM_API_KEY:-}
      PASARPULSE_LLM_MODEL: ${PASARPULSE_LLM_MODEL:-gemini-3.5-flash-lite}
      PASARPULSE_GEMINI_THINKING_LEVEL: ${PASARPULSE_GEMINI_THINKING_LEVEL:-high}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        PASARPULSE_INTERNAL_API_URL: ${PASARPULSE_INTERNAL_API_URL:-http://backend:8000}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      PASARPULSE_INTERNAL_API_URL: ${PASARPULSE_INTERNAL_API_URL:-http://backend:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
