name: PasarPulse CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch all public-facing refs
        run: git fetch origin '+refs/heads/*:refs/remotes/origin/*' --tags --force
      - name: Scan tracked files and reachable history
        run: python scripts/public_release_scan.py --history

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json
      - run: npm ci
        working-directory: app/frontend
      - run: npm run lint
        working-directory: app/frontend
      - run: npm run typecheck
        working-directory: app/frontend
      - run: npm run test
        working-directory: app/frontend
      - run: npm run build
        working-directory: app/frontend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-runtime.txt
      - run: pip install -r requirements-runtime.txt pytest==8.3.4
      - run: python -m compileall -q app scripts
      - run: PYTHONPATH=. pytest tests/backend tests/integration -q
      - run: PYTHONPATH=. python scripts/validate_demo_artifacts.py

  research-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - run: pip install -r requirements-research.txt
      - run: python -m compileall -q pipeline src experiments tests/research
      - run: PYTHONPATH=. pytest tests/research -q
      - run: PYTHONPATH=. python pipeline/validate_multimodal_results.py

  docker:
    runs-on: ubuntu-latest
    needs: [public-release-scan, frontend, backend, research-contract]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker compose build
